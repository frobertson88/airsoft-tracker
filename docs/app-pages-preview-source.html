<div id="airsoft-colour-preview">
  <div class="viz-controls"><label class="form-label">Preview page <select class="form-select" id="airsoft-page"></select></label></div>
  <div class="viz-dotted-background stage"><div class="phone" aria-label="Airsoft app phone mockup"><div class="status"><span>9:41</span><span>●●● ▰</span></div><div id="airsoft-screen" aria-live="polite"></div><div class="home-indicator"></div></div></div>
</div>
<style>
#airsoft-colour-preview { --a-bg:light-dark(#f3f4f0,#161d19);--a-paper:light-dark(#ffffff,#222b25);--a-ink:light-dark(#202c24,#edf1e9);--a-muted:light-dark(#637066,#a9b7ac);--a-line:light-dark(#dce2d9,#3b493e);--a-accent:light-dark(#34583d,#b4d7a5);--a-on:light-dark(#ffffff,#183020);--a-soft:light-dark(#e7efdf,#303f2c);--a-blue:light-dark(#245e98,#9bcaff);--a-red:light-dark(#a74536,#ffb5a8);font-family:system-ui,sans-serif; }
#airsoft-colour-preview * {box-sizing:border-box}
#airsoft-colour-preview .stage{padding:18px 8px 24px;display:flex;justify-content:center;margin-top:12px}
#airsoft-colour-preview .phone{position:relative;width:100%;max-width:390px;min-height:730px;border:1px solid var(--a-line);border-radius:32px;background:var(--a-bg);color:var(--a-ink);overflow:hidden;box-shadow:0 14px 40px #00000016;font-size:14px;line-height:1.45}
#airsoft-colour-preview .status{height:44px;display:flex;justify-content:space-between;padding:15px 25px 0;font-size:12px;font-weight:500}
#airsoft-colour-preview .home-indicator{height:4px;width:110px;background:var(--a-ink);border-radius:4px;margin:18px auto 10px}
#airsoft-colour-preview .content{padding:18px 22px;min-height:588px}
#airsoft-colour-preview h1{font-size:28px;line-height:1.15;font-weight:500;margin:6px 0 12px;letter-spacing:-.7px}
#airsoft-colour-preview h2{font-size:19px;font-weight:500;margin:0 0 8px}
#airsoft-colour-preview h3{font-size:15px;font-weight:500;margin:0 0 4px}
#airsoft-colour-preview p{margin:8px 0 18px;color:var(--a-muted)}
#airsoft-colour-preview .eyebrow{color:var(--a-accent);text-transform:uppercase;font-size:11px;letter-spacing:1.4px;font-weight:500}
#airsoft-colour-preview .box{padding:17px;background:var(--a-paper);border:1px solid var(--a-line);border-radius:var(--a-radius,16px);margin:14px 0}
#airsoft-colour-preview .soft{background:var(--a-soft)}
#airsoft-colour-preview .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
#airsoft-colour-preview .small{font-size:12px;color:var(--a-muted)}
#airsoft-colour-preview button{font:inherit;color:inherit;background:var(--a-paper);border:1px solid var(--a-line);border-radius:12px;min-height:44px;padding:10px 14px}
#airsoft-colour-preview button.primary{background:var(--a-accent);color:var(--a-on);border-color:var(--a-accent)}
#airsoft-colour-preview button.danger{color:var(--a-red)}
#airsoft-colour-preview .full{width:100%;margin-top:10px}
#airsoft-colour-preview .choice{width:100%;text-align:left;margin:7px 0;display:flex;align-items:center;justify-content:space-between}
#airsoft-colour-preview .choice.selected{border-color:var(--a-accent);background:var(--a-soft)}
#airsoft-colour-preview .field{display:block;margin:16px 0;color:var(--a-muted);font-size:12px}
#airsoft-colour-preview input,#airsoft-colour-preview .product-select{width:100%;display:block;margin-top:6px;background:var(--a-paper);color:var(--a-ink);border:1px solid var(--a-line);border-radius:10px;padding:12px;font:inherit;font-size:16px;min-height:44px}
#airsoft-colour-preview .list-row{padding:13px 0;border-bottom:1px solid var(--a-line)}
#airsoft-colour-preview .pill{display:inline-block;background:var(--a-soft);color:var(--a-accent);font-size:11px;border-radius:20px;padding:4px 9px}
#airsoft-colour-preview .bottom-nav{display:flex;justify-content:space-around;border-top:1px solid var(--a-line);padding:10px 8px 0;background:var(--a-paper)}
#airsoft-colour-preview .bottom-nav button{border:0;background:transparent;display:flex;align-items:center;flex-direction:column;gap:4px;font-size:11px;min-width:58px;padding:5px}
#airsoft-colour-preview .bottom-nav button.active{color:var(--a-accent);background:var(--a-soft)}
#airsoft-colour-preview .brand{width:54px;height:54px;display:grid;place-items:center;border-radius:16px;background:var(--a-accent);color:var(--a-on);margin:24px 0}
#airsoft-colour-preview .scores{display:flex;justify-content:space-around;text-align:center;padding:18px 0}
#airsoft-colour-preview .scores strong{font-size:36px;font-weight:500;display:block;font-variant-numeric:tabular-nums}
#airsoft-colour-preview .blue{color:var(--a-blue)}#airsoft-colour-preview .red{color:var(--a-red)}
#airsoft-colour-preview .clock{font-size:52px;letter-spacing:-2px;font-weight:500;font-variant-numeric:tabular-nums;text-align:center;margin:22px 0}
#airsoft-colour-preview .admin{background:var(--a-accent);color:var(--a-on);padding:8px 20px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
#airsoft-colour-preview .admin button{background:transparent;color:inherit;border:0;padding:0 7px}
#airsoft-colour-preview .map{height:632px;position:relative;background:var(--a-soft);background-image:linear-gradient(var(--a-line) 1px,transparent 1px),linear-gradient(90deg,var(--a-line) 1px,transparent 1px);background-size:36px 36px}
#airsoft-colour-preview .map-note{position:absolute;bottom:10px;right:14px;font-size:11px;color:var(--a-muted)}
#airsoft-colour-preview .game-strip{position:absolute;left:12px;top:12px;padding:10px;background:var(--a-paper);border-radius:12px;font-size:12px;max-width:calc(100% - 78px)}
#airsoft-colour-preview .map-menu{position:absolute;top:9px;right:10px;width:44px;padding:10px}
#airsoft-colour-preview .rail{position:absolute;top:80px;left:12px;display:grid;gap:5px;padding:4px;background:var(--a-paper);border-radius:12px}
#airsoft-colour-preview .rail button{width:44px;padding:10px;border:0;font-size:11px}
#airsoft-colour-preview .rail button.active{background:var(--a-soft);color:var(--a-accent)}
#airsoft-colour-preview .hill{position:absolute;left:43%;top:36%;width:120px;height:120px;border:2px dashed var(--a-accent);border-radius:50%;display:grid;place-items:center;text-align:center;color:var(--a-accent);background:color-mix(in srgb,var(--a-accent) 10%,transparent);font-size:12px}
#airsoft-colour-preview .map-pin{position:absolute;background:var(--a-blue);color:light-dark(#fff,#11293f);border-radius:20px;padding:6px 9px;font-size:11px}
#airsoft-colour-preview .palette{position:absolute;top:238px;left:68px;right:12px;background:var(--a-paper);padding:4px;border-radius:12px;display:flex;flex-wrap:wrap;gap:2px;z-index:3}
#airsoft-colour-preview .palette button{padding:8px;width:44px;border:0}
#airsoft-colour-preview .hint{position:absolute;bottom:35px;left:12px;right:12px;background:var(--a-paper);padding:12px;border-radius:12px;font-size:12px;z-index:2}
#airsoft-colour-preview .sheet{position:absolute;bottom:32px;left:10px;right:10px;padding:18px;background:var(--a-paper);border-radius:20px;border:1px solid var(--a-line);z-index:5}
#airsoft-colour-preview .scan-mark{display:grid;place-items:center;margin:36px auto;width:130px;height:130px;border:2px dashed var(--a-line);border-radius:30px;color:var(--a-accent)}
#airsoft-colour-preview .scan-mark svg{width:44px;height:44px}
#airsoft-colour-preview [hidden]{display:none!important}
#airsoft-colour-preview .map{height:632px}
#airsoft-colour-preview .map-hit{position:absolute;bottom:30px;left:12px;right:12px;width:calc(100% - 24px)}
#airsoft-colour-preview .bleed-timer{display:block;background:var(--a-accent);color:var(--a-on);border-radius:12px;min-height:44px;padding:12px;text-align:center;font-variant-numeric:tabular-nums;font-weight:500}
#airsoft-colour-preview .hint{bottom:84px}
#airsoft-colour-preview .sheet{bottom:84px}
#airsoft-colour-preview .medic-state{position:absolute;top:64px;left:72px;background:var(--a-paper);border-radius:10px;padding:8px 10px;font-size:12px;max-width:calc(100% - 90px)}

#airsoft-colour-preview .bottom-nav button{min-width:0;flex:1}
#airsoft-colour-preview .bottom-nav button.scan-action{color:var(--a-accent)}
#airsoft-colour-preview .bottom-nav button.scan-action.active{background:var(--a-accent);color:var(--a-on)}
#airsoft-colour-preview .rule-step{padding:14px 0;border-top:1px solid var(--a-line)}
#airsoft-colour-preview textarea{display:block;width:100%;min-height:70px;resize:vertical;background:var(--a-paper);color:var(--a-ink);border:1px solid var(--a-line);border-radius:10px;padding:10px;margin-top:6px;font:inherit;font-size:16px}
@media(max-width:360px){#airsoft-colour-preview .content{padding:16px}#airsoft-colour-preview .phone{border-radius:24px}#airsoft-colour-preview .game-strip{font-size:11px}#airsoft-colour-preview .stage{padding-left:0;padding-right:0}}
</style>
<style>
#airsoft-colour-preview[data-scheme="night"]{color-scheme:dark;--a-bg:#0B100C;--a-paper:#151C16;--a-ink:#D7E1D1;--a-muted:#A2B29F;--a-line:#2D3A2D;--a-accent:#A8C58E;--a-on:#132012;--a-soft:#182619;--a-blue:#8EBBEF;--a-red:#F09E92;--a-action:#28432C;--a-action-text:#D9E7C9;--a-map:#0A140C}
#airsoft-colour-preview .map{background-color:var(--a-map)}
#airsoft-colour-preview button.primary,#airsoft-colour-preview .bleed-timer{background:var(--a-action);color:var(--a-action-text);border-color:var(--a-action)}
</style>
<script>
(() => {
const root=document.getElementById('airsoft-colour-preview'),screen=root.querySelector('#airsoft-screen'),picker=root.querySelector('#airsoft-page');
const scheme='night';root.dataset.scheme=scheme;
const groups={
'Getting started':{signin:'Sign in',profile:'Profile',home:'Home',join:'Join Game Day',role:"Today's role",teamPick:'Choose team',sectionPick:'Choose section',createSection:'Create section'},
'Player pages':{lobby:'Game · lobby',countdown:'Game · countdown',live:'Game · live',paused:'Game · paused',map:'Map',team:'Team & section',more:'More',rules:'Rules',settings:'Settings',identity:'NFC identity',wounded:'Game · wounded',scan:'Scan · ready',treatment:'Scan · treatment',capture:'Scan · dog-tag result',objective:'Scan · objective result',result:'Game result',day:'Game Day summary'},
'Admin pages':{create:'Create Game Day',admin:'Admin lobby & queue',add:'Add game',config:'Configure game',medicSets:'Medic rulesets',medicEdit:'Create / edit medic ruleset',medicPick:'Apply medic ruleset to game',review:'Start review',adminLive:'Admin · live game',manage:'Manage game',players:'Manage players'}
};
const names=Object.assign({},...Object.values(groups));
Object.entries(groups).forEach(([group,pages])=>{const opt=document.createElement('optgroup');opt.label=group;Object.entries(pages).forEach(([value,label])=>{const o=document.createElement('option');o.value=value;o.textContent=label;opt.append(o)});picker.append(opt)});
let page='map',role='Rifleman',team='Blue',section='Alpha',mode='King of the Hill',affiliation='Friendly',audience='SEC Alpha';
let currentHit=0;
let injuryAssessed=false,treated=false;
let bleedDeadline=null;
const demoBleedSeconds=120;
const remainingBleedSeconds=()=>bleedDeadline===null?null:Math.max(0,Math.ceil((bleedDeadline-Date.now())/1000));
const bleedLabel=()=>{const seconds=remainingBleedSeconds()||0;return `Bleed out · ${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`};
const hitControl=()=>bleedDeadline===null?`<button class="map-hit primary cursor-interaction" data-map-hit ${currentHit===3?'disabled':''}>Report Hit</button>`:`<output class="map-hit bleed-timer" role="timer" aria-label="Bleed-out time remaining" aria-live="off">${bleedLabel()}</output>`;
const personalState=()=>currentHit===0||treated?'In play':injuryAssessed?['In play','Leg wound','Arm/hand wound','Dead'][currentHit]:'Awaiting medic scan';
const visibleProgress=()=>injuryAssessed?` · Hit ${currentHit}/3`:'';
const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ruleSets=[{id:'simple',name:'Standard field rules',legHelper:'Team member',legTreatment:'Apply a bandage',legInstructions:'Stop playing until treated. Follow field movement restrictions.',armHelper:'Medic',armTreatment:'Medic applies a bandage',armInstructions:'Stop playing until treated. Follow field weapon restrictions.',respawnHelper:'Marshal / respawn controller',respawnInstructions:'Return to base for a wristband scan.'}];
let editId=null,selectedRuleId='simple',gameMedic=JSON.parse(JSON.stringify(ruleSets[0]));
const ruleSummary=r=>`Leg: ${escapeHtml(r.legTreatment)} · ${escapeHtml(r.legHelper)}<br>Arm/hand: ${escapeHtml(r.armTreatment)} · ${escapeHtml(r.armHelper)}<br>Respawn: ${escapeHtml(r.respawnHelper)}`;
const ruleInput=(label,key,value)=>`<label class="field">${label}<input name="${key}" value="${escapeHtml(value)}" required maxlength="100"></label>`;
const ruleText=(label,key,value)=>`<label class="field">${label}<textarea name="${key}" required maxlength="300">${escapeHtml(value)}</textarea></label>`;
const helperInput=(label,key,value,respawn=false)=>`<label class="field">${label}<select name="${key}" class="product-select">${(respawn?['Medic','Marshal / respawn controller']:['Team member','Medic','Marshal / respawn controller']).map(v=>`<option ${v===value?'selected':''}>${v}</option>`).join('')}</select></label>`;
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const btn=(text,to,style='')=>`<button type="button" class="cursor-interaction full ${style}" data-page="${to}">${text}</button>`;
const box=(title,body,extra='')=>`<div class="box ${extra}"><h3>${title}</h3>${body}</div>`;
const row=(title,detail,extra='')=>`<div class="list-row row"><div><h3>${title}</h3><div class="small">${detail}</div></div>${extra}</div>`;
const field=(label,value,type='text')=>`<label class="field">${label}<input type="${type}" value="${value}"></label>`;
const tag=text=>`<span class="pill">${text}</span>`;
const assignment=()=>box("Today's assignment",`<div>${role}</div><div class="small">${team} · ${section}</div>`);
const nav=active=>`<nav class="bottom-nav" aria-label="Game Day">${[['Game','live','flag'],['Map','map','map'],['Scan','scan','scan-line'],['Team','team','users'],['More','more','menu']].map(([text,to,i])=>`<button class="cursor-interaction ${text==='Scan'?'scan-action':''} ${text===active?'active':''}" data-page="${to}" ${text===active?'aria-current="page"':''}>${icon(i)}${text}</button>`).join('')}</nav>`;
const heading=(label,title,sub='')=>`<div class="eyebrow">${label}</div><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}`;
function render(){
picker.value=page;let body='',active='',admin=false;
switch(page){
case 'signin':body=`<div class="brand">${icon('crosshair')}</div>${heading('Airsoft tracker','Your Game Day.<br>Your team.','Join your squad and keep the whole game in view.')}${btn('Continue with Apple','profile','primary')}${btn('Continue with Google','profile')}<p class="small">Your profile stays with you across Game Days.</p>`;break;
case 'profile':body=heading('Your profile','Choose your callsign','How your team will see you.')+field('Callsign','Ghost')+box('Photo','<span class="small">Optional · add a profile photo</span>')+btn('Save profile','home','primary');break;
case 'home':body=heading('Airsoft tracker','Ready for the field?','Good morning, Ghost.')+btn('Join Game Day','join','primary')+btn('Create Game Day','create')+`<h2 style="margin-top:32px">Your Game Days</h2>`+box('Sunday Skirmish',`<div class="row"><span class="small">Pine Ridge · 24 players</span>${tag('Open')}</div>${btn('Return to Game Day','lobby')}`)+box('Last Game Day',`<span class="small">3 completed games</span>${btn('View results','day')}`);break;
case 'join':body=heading('Join Game Day','Meet your team','Enter a code, scan a QR code or open an invite link.')+field('Join code','PINE24')+btn('Scan QR code','join')+box('Sunday Skirmish',`<div class="small">Hosted by Ranger · Pine Ridge</div><div class="small">24 players joined</div>`)+btn('Join this Game Day','role','primary');break;
case 'role':body=heading('Day setup · 1 of 3',"Today's role",'Choose the role you are playing today.')+['Rifleman','Machine Gunner','Sniper','Medic','Section Leader','Team Commander','Other'].map(r=>`<button class="choice cursor-interaction ${role===r?'selected':''}" data-role="${r}" aria-pressed="${role===r}">${r}<span>${role===r?'✓':''}</span></button>`).join('')+btn('Continue to team','teamPick','primary');break;
case 'teamPick':body=heading('Day setup · 2 of 3','Choose your team','Your role stays with you if your assignment changes.')+['Blue','Red'].map((t,i)=>`<button class="choice cursor-interaction ${team===t?'selected':''}" data-team="${t}" aria-pressed="${team===t}"><span class="${t.toLowerCase()}">${t}</span><span class="small">${i?11:13} players ${team===t?'✓':''}</span></button>`).join('')+btn('Continue to section','sectionPick','primary');break;
case 'sectionPick':body=heading('Day setup · 3 of 3','Find your section',`${team} team · joining a section is optional.`)+['Alpha','Bravo','Unassigned'].map((s,i)=>`<button class="choice cursor-interaction ${section===s?'selected':''}" data-section="${s}" aria-pressed="${section===s}">${s}<span class="small">${i===2?'No section':i===0?'6 players':'5 players'} ${section===s?'✓':''}</span></button>`).join('')+btn('Create a section','createSection')+btn('Enter lobby','lobby','primary');break;
case 'createSection':body=heading(`${team} team`,'Create a section','Give your group a name.')+field('Section name','Charlie')+`<button class="full primary cursor-interaction" data-create-section>Create & Join</button>`;break;
case 'lobby':active='Game';body=heading('Sunday Skirmish','Waiting for the start', 'Your host will start the next game.')+assignment()+box('Up next · Game 1',`<h2>King of the Hill</h2><div class="small">20 minutes · Simple medic rules</div><p>Control the hill with the most active players inside.</p>${btn('View game rules','rules')}`)+box('Ready to play','<span class="small">Your role and team are set. Meet at the staging area.</span>','soft');break;
case 'countdown':active='Game';body=heading('Game 1 · King of the Hill','Get ready', 'Shared start countdown')+`<div class="clock">00:10</div>`+box('Starting instructions','Move to your team start. Gameplay begins when the countdown finishes.','soft')+assignment()+btn('Preview live game','live','primary');break;
case 'live':active='Game';body=heading('Game 1 · Live','King of the Hill')+`<div class="clock">14:32</div><div class="scores"><div class="blue">Blue<strong>120</strong></div><div class="red">Red<strong>95</strong></div></div>`+box('Blue controls the hill','Most active players in the zone take control.','soft')+row('Your status',personalState(),tag(currentHit&&!treated?'Out of play':'Active'))+btn('Open map','map','primary')+btn('Report Hit on map','map');break;
case 'paused':active='Game';body=heading('Game 1 · King of the Hill','Game paused','Gameplay is frozen.')+`<div class="clock">14:32</div>`+box('Host instruction','Hold position and wait for the resume alert.','soft')+box('Paused','Time, scoring, hill movement, treatment and captures are frozen.')+btn('Open map','map');break;
case 'team':active='Team';body=heading('Sunday Skirmish',`${team} team`)+assignment()+row('Sections','Alpha · 6 / Bravo · 5 / Unassigned · 2')+`<h2 style="margin-top:20px">${section}</h2>`+[['Ghost',role],['Ranger','Section Leader'],['Patch','Medic'],['Echo','Machine Gunner']].map(([n,r])=>row(n,r)).join('')+btn('Change role','role')+btn('Change assignment','teamPick')+`<p class="small">Assignment changes are available between games.</p>`;break;
case 'more':active='More';body=heading('Sunday Skirmish','More')+btn('Game rules','rules')+btn('My NFC wristband','identity')+btn('Settings','settings')+btn('Switch to Admin Mode','admin')+`<p class="small">Admin Mode is available only with assigned permission.</p>`+btn('Leave Game Day','home','danger');break;
case 'rules':active='More';body=heading('Game rules','King of the Hill')+box('Objective','Have the most active players inside the hill to control it.')+row('Duration','20 minutes')+row('Scoring','Enabled · 1 point / second while in control')+row('Hill','30 m radius · relocation every 5 minutes')+box(escapeHtml(gameMedic.name),'Leg wound → arm/hand wound → dead. Treatment does not reset hit progression.')+box('Treatment rules',ruleSummary(gameMedic))+box('Field instructions',`${escapeHtml(gameMedic.legInstructions)}<br>${escapeHtml(gameMedic.armInstructions)}<br>${escapeHtml(gameMedic.respawnInstructions)}`)+`<p class="small">Sample game configuration · selected ruleset copied to this game.</p>`;break;
case 'settings':active='More';body=heading('Preferences','Settings')+field('Callsign','Ghost')+`<label class="choice">Sound alerts<input type="checkbox" checked style="width:24px;min-height:24px;margin:0"></label><label class="choice">Vibration<input type="checkbox" checked style="width:24px;min-height:24px;margin:0"></label><p class="small">Sound and vibration are proposed enhancements.</p>`;break;
case 'identity':active='More';body=heading('Player identity','My wristband')+`<div class="scan-mark">${icon('nfc')}</div>`+box('Ghost · wristband linked','Your band identifies you. Your current status is kept in the app.','soft')+assignment();break;
case 'wounded':active='Game';body=heading('Medic proposal · Live','Awaiting medic scan','Hit reported · Out of play')+box('Assessment pending','Stay out of play. A medic must scan your wristband before your wound and treatment instructions are revealed.','soft')+box('Awaiting treatment','You cannot treat yourself. Treatment keeps this life and hit progression.')+btn('Open map','map')+btn('Preview helper scan','scan');break;
case 'scan':active='Scan';body=heading('Game 1 · Live','Ready to scan','Hold your phone near a wristband or objective tag.')+`<div class="scan-mark">${icon('nfc')}</div>`+box('One scan button','Dog tags, treatment and objective points use the same reader.','soft')+`<p class="small">Preview only · on iPhone, Scan opens the system scanning sheet.</p><h3>Simulate a detected tag</h3>`+btn('Enemy wristband · dead player','capture')+btn('Teammate wristband · wounded','treatment')+btn('Objective tag · Point 1','objective');break;
case 'treatment':{active='Scan';const hit=currentHit||1;body=heading('Medic helper preview · assessment',hit===3?'Ghost is dead':'Treat Ghost',`${['In play','Leg wound','Arm/hand wound','Dead'][hit]} · Hit ${hit}/3`)+box(hit===3?'Return instructions':'Required treatment',hit===3?`${escapeHtml(gameMedic.respawnInstructions)}<br>Permitted helper: ${escapeHtml(gameMedic.respawnHelper)}`:`${escapeHtml(hit===1?gameMedic.legTreatment:gameMedic.armTreatment)}<br><span class="small">Permitted helper: ${escapeHtml(hit===1?gameMedic.legHelper:gameMedic.armHelper)}</span>`)+box('Assessment revealed','Example of an authorised second party scanning Ghost. The player can now see this assessment.')+(hit<3?`<button class="full primary cursor-interaction" data-confirm-treatment>Confirm treatment completed</button>`:'')+`<div id="scan-result" role="status"></div>`+btn('Return to player map','map')+btn('Scan another tag','scan');break;}
case 'capture':active='Scan';body=heading('Scan · confirmed','Dog tag captured','Example of a successful eligible scan')+box('+1 to your team',`Viper · ${team==='Blue'?'Red':'Blue'} team · Life 2<br>Your captures: 1`,'soft')+box('Capture complete','The game validated and captured this life’s tag once. No separate Capture button.')+`<p class="small">Dog-tag capture must be enabled. Capturing does not treat or respawn the player.</p>`+btn('Scan another tag','scan','primary')+btn('Return to map','map');break;
case 'objective':active='Scan';body=heading('Scan · confirmed','Point 1 visited','Objective Game · Patrol example')+box('Patrol progress','Point 1 ✓ → Point 5 → Point 6','soft')+box('Next point · 5','The next step unlocks after the accepted scan.')+btn('Scan another tag','scan','primary')+btn('Return to map','map');break;
case 'medicSets':admin=true;active='More';body=heading('Game Day admin','Medic rulesets','Save treatment rules once, then choose a set for each game.')+ruleSets.map(r=>box(escapeHtml(r.name),`<div class="small">Leg → arm/hand → dead</div><p class="small">${ruleSummary(r)}</p><button class="full cursor-interaction" data-edit-rules="${r.id}">Edit ruleset</button>`)).join('')+`<button class="full primary cursor-interaction" data-new-rules>Create ruleset</button>`+btn('Choose a set for a game','medicPick')+btn('Back to admin lobby','admin');break;
case 'medicEdit':{admin=true;active='More';const r=ruleSets.find(x=>x.id===editId)||{...ruleSets[0],name:'New field rules'};body=heading('Medic ruleset',editId?'Edit ruleset':'Create ruleset','Simple sequence · Leg → arm/hand → dead')+`<label class="field">Rule style<select class="product-select"><option>Simple three-hit sequence</option><option disabled>Random wounds · future work</option><option disabled>Planned / custom sequence · future work</option></select></label><p class="small">This demo edits Simple rules. Custom wound pools, further-hit behaviour and treatment outcomes remain documented future options.</p><form id="medic-form">${ruleInput('Ruleset name','name',r.name)}<div class="rule-step"><h3>Hit 1 · Leg wound</h3>${helperInput('Who can treat','legHelper',r.legHelper)}${ruleInput('Physical treatment','legTreatment',r.legTreatment)}${ruleText('Field instructions','legInstructions',r.legInstructions)}</div><div class="rule-step"><h3>Hit 2 · Arm/hand wound</h3>${helperInput('Who can treat','armHelper',r.armHelper)}${ruleInput('Physical treatment','armTreatment',r.armTreatment)}${ruleText('Field instructions','armInstructions',r.armInstructions)}</div><div class="rule-step"><h3>Hit 3 · Dead</h3>${helperInput('Who can return a dead player','respawnHelper',r.respawnHelper,true)}${ruleText('Respawn instructions','respawnInstructions',r.respawnInstructions)}</div><p class="small">No self-treatment. Treatment preserves progression; respawn starts a new life. Further-hit behaviour follows the selected game’s agreed rules.</p><button type="submit" class="full primary cursor-interaction">Save ruleset</button></form>`+btn('Cancel','medicSets');break;}
case 'medicPick':admin=true;active='More';body=heading('Configure game','Choose medic rules',mode)+ruleSets.map(r=>`<button class="choice cursor-interaction ${selectedRuleId===r.id?'selected':''}" data-select-rules="${r.id}" aria-pressed="${selectedRuleId===r.id}"><div><h3>${escapeHtml(r.name)}</h3><span class="small">${ruleSummary(r)}</span></div><span>${selectedRuleId===r.id?'✓':''}</span></button>`).join('')+`<button class="full primary cursor-interaction" data-apply-rules>Use for this game</button>`+btn('Manage saved sets','medicSets')+`<p class="small">Applies when the Ready game is saved. Live and completed games keep their own rules.</p>`;break;
case 'result':active='Game';body=heading('Game 1 · Complete','Blue wins','King of the Hill · Final score')+`<div class="scores"><div class="blue">Blue<strong>240</strong></div><div class="red">Red<strong>195</strong></div></div>`+box('Return to staging','Your role, team and section carry into the next game.','soft')+btn('Back to lobby','lobby','primary');break;
case 'day':body=heading('Sunday Skirmish · Closed','Game Day results','Pine Ridge · 24 players')+row('Game 1 · King of the Hill','Blue wins · 240–195')+row('Game 2 · Team Deathmatch','Complete · No winner determined')+row('Game 3 · Objective Game','Complete · Patrol progress recorded')+box('Thanks for playing','Your completed games and assignments stay in the history.')+btn('Return home','home','primary');break;
case 'create':body=heading('Host a Game Day','Bring everyone together')+field('Game Day name','Sunday Skirmish')+field('Field / location · optional','Pine Ridge')+box('Start with two teams','Blue and Red · names can be changed later.')+btn('Create Game Day','admin','primary');break;
case 'admin':admin=true;active='More';body=heading('Sunday Skirmish','Game Day lobby')+box('Invite players',`<div class="row"><h2>PINE24</h2>${icon('qr-code')}</div><div class="small">Join code · QR / invite sharing</div>`)+row('24 joined','Blue 13 · Red 11 · 2 setups incomplete')+btn('Manage players & teams','players')+btn('Medic rulesets','medicSets')+`<h2 style="margin-top:20px">Game queue</h2>`+box('1 · King of the Hill',`<div class="small">Ready · 20 minutes · ${escapeHtml(gameMedic.name)}</div>${btn('Edit game rules','config')}${btn('Start game','review','primary')}`)+row('2 · Team Deathmatch','Unlimited · Ready')+row('3 · Objective Game','Planned Patrol · Ready')+btn('Add game','add')+btn('End Game Day','day','danger');break;
case 'add':admin=true;body=heading('Game queue','Choose game type')+['King of the Hill','Team Deathmatch','Objective Game'].map(m=>`<button class="choice cursor-interaction" data-mode="${m}">${m}${icon('chevron-right')}</button>`).join('');break;
case 'config':admin=true;active='More';body=heading('Configure Ready game',mode)+field('Duration · minutes','20','number')+`<label class="choice">Unlimited duration<input type="checkbox" style="width:24px;min-height:24px;margin:0"></label>`+field('Start countdown · seconds','10','number')+row('Participating teams','Blue + Red')+box('Medic rules',`${escapeHtml((ruleSets.find(r=>r.id===selectedRuleId)||ruleSets[0]).name)}${btn('Choose / change ruleset','medicPick')}`)+(mode==='King of the Hill'?field('Hill radius · metres','30','number')+row('Allowed hill area','Draw on the field map')+row('Scoring / relocation','Enabled · 1 pt/s · Every 5 min'):mode==='Objective Game'?box('Planned Patrol','Point 1 → Point 5 → Point 6. Later steps unlock after completion.')+`<p class="small">Mission audience and scanner eligibility still need agreement.</p>`:box('Victory','One viable team remaining wins. Timed-result rules remain open.'))+`<button class="full primary cursor-interaction" data-save-game>Save game configuration</button>`;break;
case 'review':admin=true;body=heading('Start review','King of the Hill')+row('Eligible players','22 · Blue 12 / Red 10')+row('Still in setup','2 players · Remain in staging')+row('Duration','20 minutes')+row('Countdown','10 seconds')+row('Medic rules',escapeHtml(gameMedic.name))+box('Treatment rules',ruleSummary(gameMedic))+box('Ready to start','One countdown begins for everyone. Gameplay starts automatically at zero.','soft')+btn('Start countdown','countdown','primary')+btn('Back to lobby','admin');break;
case 'adminLive':admin=true;body=heading('Game 1 · Live','King of the Hill')+`<div class="clock">14:32</div>`+row('Score','Blue 120 · Red 95')+btn('Pause game','paused','primary')+btn('Manage game','manage')+btn('Manage players','players')+btn('End game','result','danger');break;
case 'manage':admin=true;body=heading('Game 1 · Live','Manage game')+field('Add time · minutes','5','number')+box('Effect preview','Remaining time would change from 14:32 to 19:32. Existing scores remain.')+`<button class="full primary cursor-interaction" data-local-note="Time change previewed · sample only">Apply time change</button>`+btn('Move hill now','map')+row('Operational changes','Record changes and alert affected players')+btn('End Current Game & Set Up Next','add','danger');break;
case 'players':admin=true;body=heading('Sunday Skirmish','Players & assignments')+row('Blue · 13 players','Alpha 6 · Bravo 5 · Unassigned 2')+row('Red · 11 players','Delta 6 · Echo 5')+row('Ghost',`${role} · ${team} · ${section}`)+row('Patch','Medic · Blue · Alpha')+row('New arrival','Role missing · No team',tag('Setup'))+btn('Edit assignments','teamPick')+`<p class="small">During live play, pause before correcting assignments. Choosing a role does not grant leadership authority.</p>`+`<button class="full danger cursor-interaction" data-local-note="Confirmation required: clear team and section assignments while retaining roles and results.">Clear team assignments</button>`;break;
case 'map':screen.innerHTML=mapMarkup();bind();return;
}
if(admin&&!active)active='More';
screen.innerHTML=(admin?`<div class="admin"><span>ADMIN MODE</span><button class="cursor-interaction" data-page="lobby">Player Mode</button></div>`:'')+`<main class="content">${body}</main>`+(active?nav(active):'');bind();
}
function mapMarkup(){return `<div class="map" aria-label="Illustrative field map"><div class="game-strip">KOTH · <span class="blue">120</span> / <span class="red">95</span> · 14:32</div><button class="map-menu cursor-interaction" aria-label="Main menu" data-map-menu>${icon('menu')}</button><div class="rail">${[['cursor','mouse-pointer-2','Cursor / Map'],['scan','scan-line','Scan wristband or objective'],['affiliation','','Toggle Friendly / Enemy'],['audience','','Toggle Section / Team audience'],['icons','map-pin','Icons'],['draw','pencil','Draw'],['delete','trash-2','Delete within boundary']].map(([t,i,label])=>`<button class="cursor-interaction ${t==='cursor'?'active':''}" data-tool="${t}" aria-label="${label}">${i?icon(i):t==='affiliation'?(affiliation==='Friendly'?'F':'E'):(audience.startsWith('SEC')?'SEC':'TEAM')}</button>`).join('')}</div><div class="medic-state" role="status">${personalState()}${visibleProgress()}</div><div class="hill">Hill<br>Blue control</div><span class="map-pin" style="left:31%;top:57%">Ghost</span><span class="map-pin" style="left:58%;top:61%">Patch</span><span class="map-pin" style="left:65%;top:30%">Alpha</span><div class="palette" hidden></div><div class="hint" hidden></div><div class="sheet" hidden></div>${hitControl()}<span class="map-note">Preview · no live location</span></div>`}
function bind(){
root.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));
root.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;render()});
root.querySelectorAll('[data-team]').forEach(b=>b.onclick=()=>{if(team!==b.dataset.team)section='Unassigned';team=b.dataset.team;render()});
root.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;render()});
root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;go('config')});
root.querySelectorAll('[data-local-note]').forEach(b=>b.onclick=()=>{let note=screen.querySelector('.local-note');if(!note){note=document.createElement('p');note.className='small local-note';note.setAttribute('role','status');b.after(note)}note.textContent=b.dataset.localNote});
const create=root.querySelector('[data-create-section]');if(create)create.onclick=()=>{section=screen.querySelector('input').value.trim()||'Unassigned';go('lobby')};
const treat=root.querySelector('[data-confirm-treatment]');if(treat)treat.onclick=()=>{treated=true;bleedDeadline=null;screen.querySelector('#scan-result').innerHTML=box('Treatment confirmed',`Ghost is in play · Hit progression remains ${currentHit} of 3.`,'soft');treat.disabled=true};
root.querySelectorAll('[data-edit-rules]').forEach(b=>b.onclick=()=>{editId=b.dataset.editRules;go('medicEdit')});
const newRules=root.querySelector('[data-new-rules]');if(newRules)newRules.onclick=()=>{editId=null;go('medicEdit')};
const medicForm=root.querySelector('#medic-form');if(medicForm)medicForm.onsubmit=e=>{e.preventDefault();const values=Object.fromEntries(new FormData(medicForm));Object.keys(values).forEach(k=>values[k]=values[k].trim());if(Object.values(values).some(v=>!v)){medicForm.reportValidity();return}const id=editId||'rules-'+Date.now();const saved={id,...values};const index=ruleSets.findIndex(x=>x.id===id);if(index>=0)ruleSets[index]=saved;else ruleSets.push(saved);selectedRuleId=id;go('medicSets')};
root.querySelectorAll('[data-select-rules]').forEach(b=>b.onclick=()=>{selectedRuleId=b.dataset.selectRules;render()});
const applyRules=root.querySelector('[data-apply-rules]');if(applyRules)applyRules.onclick=()=>go('config');
const saveGame=root.querySelector('[data-save-game]');if(saveGame)saveGame.onclick=()=>{gameMedic=JSON.parse(JSON.stringify(ruleSets.find(r=>r.id===selectedRuleId)||ruleSets[0]));go('admin')};
if(page==='map')bindMap();if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
}
function bindMap(){const palette=screen.querySelector('.palette'),hint=screen.querySelector('.hint');let sheet=screen.querySelector('.sheet');
const reportHit=screen.querySelector('[data-map-hit]');if(reportHit)reportHit.onclick=()=>{currentHit=Math.min(3,currentHit+1);injuryAssessed=false;treated=false;bleedDeadline=Date.now()+demoBleedSeconds*1000;render()};
screen.querySelector('[data-map-menu]').onclick=()=>{sheet.hidden=!sheet.hidden;sheet.innerHTML=`<div class="row"><h2>Main menu</h2><button data-close-menu class="cursor-interaction" aria-label="Close menu">${icon('x')}</button></div>${[['Game','live'],['Map','map'],['Team','team'],['More','more']].map(([n,p])=>btn(n,p)).join('')}`;sheet.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));sheet.querySelector('[data-close-menu]').onclick=()=>sheet.hidden=true;if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}})};
screen.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{const t=b.dataset.tool;if(t==='scan'){go('scan');return}palette.hidden=true;hint.hidden=true;sheet.hidden=true;if(t==='affiliation'){affiliation=affiliation==='Friendly'?'Enemy':'Friendly';if(affiliation==='Enemy')audience='TEAM';b.textContent=affiliation==='Friendly'?'F':'E';screen.querySelector('[data-tool="audience"]').textContent=audience.startsWith('SEC')?'SEC':'TEAM';return}if(t==='audience'){if(affiliation==='Friendly')audience=audience==='TEAM'?'SEC Alpha':'TEAM';b.textContent=audience.startsWith('SEC')?'SEC':'TEAM';return}screen.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));if(t==='cursor')return;if(t==='delete'){hint.hidden=false;hint.textContent='Delete boundary · Tap at least 3 corners, then preview before confirming.';return}const options=t==='draw'?[['Label','type'],['Waypoints','route'],['Arrow','move-up-right'],['Line','minus'],['Area','pentagon'],['Defence line','shield'],['Attack line','swords']]:(affiliation==='Friendly'?[['Infantry','person-standing'],['Recon','binoculars'],['MG Gunner','crosshair'],['Sniper','focus'],['Leader','flag'],['2IC','user'],['FOB','house'],['Rally','map-pin']]:[['Infantry','person-standing'],['FOB','house'],['Rally','map-pin'],['Sniper','focus'],['MG','crosshair'],['Drone','plane'],['Vehicle','truck'],['Package','package']]);palette.hidden=false;palette.style.top=(b.parentElement.offsetTop+b.offsetTop)+'px';palette.innerHTML=options.map(([n,i])=>`<button class="cursor-interaction" aria-label="${n}" data-action="${n}">${icon(i)}</button>`).join('');palette.querySelectorAll('[data-action]').forEach(x=>x.onclick=()=>{palette.hidden=true;hint.hidden=false;hint.textContent=`${x.dataset.action} · ${affiliation} · ${audience} — Tap map to place. Preview only.`});if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}})});
}
function go(p){if(!names[p])return;if(p==='treatment'){if(currentHit===0)currentHit=1;injuryAssessed=true;treated=false;}page=p;render();if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{page:names[page],scheme},privateContent:{page,scheme}}).catch(()=>{})}
picker.onchange=()=>go(picker.value);
const saved=window.openai?.widgetState?.privateContent?.page;if(names[saved])page=saved;
window.addEventListener('openai:set_globals',e=>{const savedPage=e.detail?.globals?.widgetState?.privateContent?.page;if(names[savedPage]){page=savedPage;render()}});
render();const bleedTicker=setInterval(()=>{if(!root.isConnected){clearInterval(bleedTicker);return}const timer=root.querySelector('.bleed-timer');if(timer)timer.textContent=bleedLabel()},250);
const design={radius:16};if(globalThis.Tweak){const tweak=new Tweak({container:root.querySelector('.phone'),onChange:()=>root.style.setProperty('--a-radius',design.radius+'px')});tweak.addSlider(design,'radius',{label:'Panel corners',min:4,max:24,unit:'px'})}
})();
</script>
